<svg xmlns="http://www.w3.org/2000/svg" width="440" height="530" viewBox="0 0 440 530" role="img" aria-labelledby="title desc"><title id="title">Planned host-controlled power-cycle loop</title><desc id="desc">Host script requests a power cycle, BenchSwitch switches a selected port, the device restarts and re-enumerates, and the host collects logs and results before another test.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#999" stroke-width="1.4"/></marker></defs><rect width="440" height="530" fill="#181818"/><g fill="none" stroke="#666" stroke-width="1"><rect x="58" y="24" width="320" height="80" rx="3"/><rect x="58" y="144" width="320" height="80" rx="3"/><rect x="58" y="264" width="320" height="80" rx="3"/><rect x="58" y="384" width="320" height="80" rx="3"/></g><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#e8e8e8" font-size="21"><text x="218" y="56">Host / test script</text><text x="218" y="176">BenchSwitch</text><text x="218" y="296">Device under test</text><text x="218" y="416">Host / test script</text></g><g fill="#bfbfbf" font-size="16"><text x="218" y="82">Request a power cycle</text><text x="218" y="202">Cycle the selected port’s power</text><text x="218" y="322">Restart and re-enumerate</text><text x="218" y="442">Collect logs and test results</text><text x="218" y="506">Repeat with the next test</text></g></g><g fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#arrow)"><path d="M218 107 V137"/><path d="M218 227 V257"/><path d="M218 347 V377"/><path d="M58 424 H26 V64 H50" stroke-dasharray="4 5"/></g></svg>